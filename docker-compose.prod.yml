name: escola-production

x-security: &security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  restart: unless-stopped

services:
  gateway:
    <<: *security
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "443:8443"
    volumes:
      - ./ops/nginx/escola.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:?TLS_CERT_FILE is required}:/run/tls/tls.crt:ro
      - ${TLS_KEY_FILE:?TLS_KEY_FILE is required}:/run/tls/tls.key:ro
    tmpfs:
      - /tmp:noexec,nosuid,size=16m,mode=1777
      - /var/cache/nginx:noexec,nosuid,size=16m,mode=1777
      - /var/run:noexec,nosuid,size=4m,mode=1777
    networks:
      - edge_internal
      - api_internal
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    <<: *security
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL must use HTTPS}
        NEXT_PUBLIC_MSINFOR_CENTRAL_FRONTEND_URL: ${MSINFOR_CENTRAL_FRONTEND_URL:?MSINFOR_CENTRAL_FRONTEND_URL must use HTTPS}
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    networks:
      - edge_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    <<: *security
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      FRONTEND_URL: ${SCHOOL_PUBLIC_URL:?SCHOOL_PUBLIC_URL must use HTTPS}
      CORS_ALLOWED_ORIGINS: ${SCHOOL_PUBLIC_URL:?SCHOOL_PUBLIC_URL must use HTTPS}
      BACKEND_PUBLIC_URL: ${SCHOOL_PUBLIC_URL:?SCHOOL_PUBLIC_URL must use HTTPS}/api/v1
      TELEGRAM_POLLING_ENABLED: "false"
      TELEGRAM_DEBUG_LOG_ENABLED: "false"
      FINANCEIRO_API_URL: ${FINANCEIRO_API_URL:?FINANCEIRO_API_URL must use HTTPS}
      FINANCEIRO_HMAC_ESCOLA_SECRET_FILE: /run/secrets/financeiro_hmac_escola
      SOURCE_SYSTEM_ESCOLA_HMAC_SECRET_FILE: /run/secrets/source_system_escola_hmac
      MSINFOR_CENTRAL_API_URL: ${MSINFOR_CENTRAL_API_URL:?MSINFOR_CENTRAL_API_URL must use HTTPS}
      MSINFOR_CENTRAL_SYSTEM_ID: ESCOLA
      MSINFOR_CENTRAL_SYSTEM_KEY_FILE: /run/secrets/central_system_key
      MSINFOR_CENTRAL_IDENTITY_ENABLED: "true"
      MSINFOR_DATABASE_ALIAS: ${MSINFOR_DATABASE_ALIAS:-ESCOLA_01}
      ESCOLA_DATABASE_RUNTIME_ROLE: ${ESCOLA_DATABASE_RUNTIME_ROLE:-escola_app}
      ESCOLA_DATABASE_HOST: ${ESCOLA_DATABASE_HOST:?ESCOLA_DATABASE_HOST is required}
      ESCOLA_DATABASE_NAME: ${ESCOLA_DATABASE_NAME:-escola_01}
      TRUST_PROXY_HOPS: "1"
      AUTH_SESSION_MAX_PER_ACCOUNT: "10"
      SECRET_MIGRATION_BACKUP_DIR: /backups
      ENABLE_API_DOCS: "false"
    expose:
      - "3001"
    volumes:
      - escola_data:/data
      - escola_secret_backups:/backups
    secrets:
      - database_url
      - jwt_secret
      - data_encryption_key
      - central_system_key
      - financeiro_hmac_escola
      - source_system_escola_hmac
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    networks:
      - api_internal
      - financeiro_internal
      - outbound
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  financeiro:
    <<: *security
    image: ${FINANCEIRO_IMAGE:-msinfor/financeiro:local}
    profiles:
      - integrated-financeiro
    expose:
      - "3443"
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    networks:
      - financeiro_internal
      - outbound

networks:
  edge_internal:
    internal: true
  api_internal:
    internal: true
  financeiro_internal:
    internal: true
  outbound:

volumes:
  escola_data:
  escola_secret_backups:

secrets:
  database_url:
    file: ${DATABASE_URL_SECRET_FILE:?DATABASE_URL_SECRET_FILE is required}
  jwt_secret:
    file: ${JWT_SECRET_FILE:?JWT_SECRET_FILE is required}
  data_encryption_key:
    file: ${DATA_ENCRYPTION_KEY_FILE:?DATA_ENCRYPTION_KEY_FILE is required}
  central_system_key:
    file: ${MSINFOR_CENTRAL_SYSTEM_KEY_FILE:?MSINFOR_CENTRAL_SYSTEM_KEY_FILE is required}
  financeiro_hmac_escola:
    file: ${FINANCEIRO_HMAC_ESCOLA_SECRET_FILE:?FINANCEIRO_HMAC_ESCOLA_SECRET_FILE is required}
  source_system_escola_hmac:
    file: ${SOURCE_SYSTEM_ESCOLA_HMAC_SECRET_FILE:?SOURCE_SYSTEM_ESCOLA_HMAC_SECRET_FILE is required}
